<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mixtape</title>
</head>
<body>

  <h1>Where am I?</h1>

  <!-- Safari only shares location after a real tap, and audio will need
       a tap on every mobile browser anyway. So the experience starts
       with a button — same as every trail will. -->
  <button id="start">Start</button>

  <!-- Three read-outs. Each dash is a placeholder that JavaScript will
       replace later. The id on each span is the hook it will use to
       find the right one. -->
  <p>Position – <span id="position">—</span></p>
  <p>Accuracy – <span id="accuracy">—</span></p>
  <p>Last update – <span id="updated">—</span></p>
  <p>Updates – <span id="count">—</span></p>
  <p>Audio – <span id="audio-state">—</span></p>
  <p>Distance to target – <span id="distance">—</span></p>

  <!-- The test track. No "controls" attribute, so it's invisible —
       our own script decides when it plays. -->
  <audio id="track" src="assets/audio/test-001.m4a"></audio>

  <script>
    // Two bits of memory, so the page can report frequency:
    // how many fixes have arrived, and the clock time of the latest one.
    let updateCount = 0;
    let lastFixAt = null;

    // The target comes from the web address, not the code — e.g.
    //   https://…/mixtape/?lat=51.50772&lon=-0.12794
    // (that example is Trafalgar Square). Keeping coordinates in the
    // address means none ever sit in this public file.
    const params = new URLSearchParams(location.search);
    const haveTarget = params.has("lat") && params.has("lon");
    const target = {
      latitude: Number(params.get("lat")),
      longitude: Number(params.get("lon"))
    };
    if (!haveTarget) {
      document.getElementById("distance").textContent =
        "no target — add ?lat=…&lon=… to the address";
    }

    // The zone: within this many metres of the target, sound plays.
    // Tunable from the address (…&radius=25); otherwise 5 m — tight,
    // on purpose, to find out what GPS on a real street can support.
    const zoneRadius = Number(params.get("radius") || 5);

    // Whether we're currently inside the zone. The trigger fires on
    // the CHANGE of this answer — crossing the line is the event.
    let insideZone = false;

    // How far apart two points are, in metres. This treats the ground
    // as flat, which is near-enough exact at trail scale (the error
    // only matters over many kilometres).
    function distanceInMetres(a, b) {
      // A degree of latitude is about 111,320 m everywhere. A degree
      // of longitude is that much at the equator and shrinks towards
      // the poles — the cos() applies that squeeze for our latitude.
      const north = (a.latitude - b.latitude) * 111320;
      const east = (a.longitude - b.longitude) * 111320
                   * Math.cos(a.latitude * Math.PI / 180);
      // Those are two sides of a right angle; Pythagoras gives the
      // straight-line distance.
      return Math.sqrt(north * north + east * east);
    }

    // When the Start button is tapped, start following our position.
    // watchPosition keeps reporting for as long as the page is open.
    document.getElementById("start").addEventListener("click", function () {

      // One watch is enough — a second tap would start a second one,
      // so switch the button off once it's done its job.
      document.getElementById("start").disabled = true;

      document.getElementById("updated").textContent = "asking…";

      // Unlock the audio. Mobile browsers only let a page start sound
      // during a real tap — so we start it here, then pause it at
      // once. The browser now considers this track "user-approved",
      // and the zone, not a tap, decides when it really plays.
      const track = document.getElementById("track");
      track.play().then(
        function () {
          track.pause();
          document.getElementById("audio-state").textContent =
            "unlocked — waiting for zone";
        },
        function (error) {
          document.getElementById("audio-state").textContent =
            "failed: " + error.message;
        }
      );

      navigator.geolocation.watchPosition(

        // Runs if we get a position.
        function (position) {
          document.getElementById("position").textContent =
            position.coords.latitude + ", " + position.coords.longitude;

          // Accuracy is a radius in metres: "you are within this many
          // metres of the point above". Smaller is better.
          document.getElementById("accuracy").textContent =
            Math.round(position.coords.accuracy) + " m";

          // If we know where the target is, say how far away it is —
          // and run the trigger.
          if (haveTarget) {
            const distance = distanceInMetres(position.coords, target);
            document.getElementById("distance").textContent =
              Math.round(distance) + " m";

            const nowInside = distance <= zoneRadius;

            // Act only when the answer CHANGES. Just arrived: play.
            if (nowInside && !insideZone) {
              document.getElementById("track").play();
              document.getElementById("audio-state").textContent =
                "playing — inside zone";
            }
            // Just left: pause. (Not rewound — walking back in picks
            // up where it left off. A design choice we can revisit.)
            if (!nowInside && insideZone) {
              document.getElementById("track").pause();
              document.getElementById("audio-state").textContent =
                "paused — left zone";
            }

            insideZone = nowInside;
          }

          // Note the arrival: one more fix, at this moment.
          // The ticker below turns lastFixAt into "n s ago".
          updateCount = updateCount + 1;
          lastFixAt = Date.now();
          document.getElementById("count").textContent = updateCount;
        },

        // Runs if we don't — permission refused, no signal, etc.
        // Showing the reason on the page is the diagnostic bit.
        function (error) {
          document.getElementById("updated").textContent =
            "failed: " + error.message;
        },

        // Ask for the best fix the device can give (real GPS on a
        // phone). Costs more battery — the right trade for a trail.
        { enableHighAccuracy: true }
      );

      // A once-a-second ticker: how stale is the latest fix?
      // If the GPS goes quiet, this number climbs — and that's the
      // page telling the truth instead of saying "just now" forever.
      setInterval(function () {
        if (lastFixAt !== null) {
          const seconds = Math.round((Date.now() - lastFixAt) / 1000);
          document.getElementById("updated").textContent = seconds + " s ago";
        }
      }, 1000);
    });
  </script>

</body>
</html>
