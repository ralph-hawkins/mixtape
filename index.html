<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mixtape</title>

  <!-- Leaflet, the same map library map.html uses — pinned to the
       same version. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* The map gets the top half of the window (1vh = 1% of the
       window's height), read-outs live below it. */
    #map { height: 50vh; }

    /* The per-zone status table: a little air between columns. */
    #zones td { padding-right: 1em; }

    /* The event log: plain lines, no bullets, slightly smaller. */
    #log { list-style: none; padding-left: 0; font-size: 0.9em; }
  </style>
</head>
<body>

  <h1>Logging</h1>

  <!-- Safari only shares location after a real tap, and audio will need
       a tap on every mobile browser anyway. So the experience starts
       with a button — same as every trail will. -->
  <button id="start">Start</button>

  <!-- The map: the trail's circles, and you. -->
  <div id="map"></div>

  <!-- The read-outs. Each dash is a placeholder that JavaScript will
       replace later. The id on each span is the hook it will use to
       find the right one. -->
  <p>Position – <span id="position">—</span></p>
  <p>Accuracy – <span id="accuracy">—</span></p>
  <p>Last update – <span id="updated">—</span></p>
  <p>Updates – <span id="count">—</span></p>
  <p>Audio – <span id="audio-state">—</span></p>
  <p>Nearest zone – <span id="distance">—</span></p>

  <!-- Per-zone status: one row per zone, kept current by the
       engine. Answers "what's happening right now?" -->
  <h2>Zones</h2>
  <table id="zones"></table>

  <!-- The event log: a line appears whenever something happens,
       newest at the top. Answers "what just happened?" — useful
       when the moment has already passed. -->
  <h2>Log</h2>
  <ul id="log"></ul>

  <!-- The trail definition — a separate file so curators only ever
       need to touch that one. It must load before the engine below,
       and scripts run in page order, so it comes first. -->
  <script src="trail.js"></script>

  <script>
    // Two bits of memory, so the page can report frequency:
    // how many fixes have arrived, and the clock time of the latest one.
    // First: did the trail actually arrive? If trail.js is missing or
    // has a typo that breaks it, say so loudly and stop — a page that
    // carries on without its trail just looks mysteriously dead.
    if (typeof trail === "undefined") {
      document.getElementById("audio-state").textContent =
        "trail.js failed to load — check the file for typos";
      document.getElementById("start").disabled = true;
      throw new Error("trail.js missing or broken");
    }

    let updateCount = 0;
    let lastFixAt = null;

    // "You are here" on the map: a dot for the latest fix and a halo
    // for its accuracy. Both created on the first fix.
    let hereDot = null;
    let hereHalo = null;

    // Set up each zone from the trail file: its own player, and its
    // own memory of whether we're currently standing inside it. The
    // trigger fires when that answer CHANGES — crossing the line is
    // the event.
    trail.zones.forEach(function (zone) {
      zone.player = new Audio(zone.audio);
      // Looping is the trail file's choice. "=== true" means a zone
      // that forgets the loop line just plays once — the safe default.
      zone.player.loop = (zone.loop === true);
      zone.inside = false;
      // How many times this zone's track has started from the top —
      // measured against the trail file's "plays" allowance.
      zone.playCount = 0;
      // When a track reaches its natural end, its circle goes quiet —
      // or grey, if that was the zone's last allowed play. (This is
      // also what dims a "finish" zone once its last play-through
      // ends, some time after the walker has left.)
      zone.player.addEventListener("ended", function () {
        paintZone(zone);
        logEvent(zone.name + " finished" +
          (playsSpent(zone) ? " — all plays used" : ""));
        updateZoneCells(zone);
      });
    });

    // The map — same recipe as map.html: OpenStreetMap tiles, one
    // true-radius circle per zone, view framed around the trail.
    const map = L.map("map");
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);
    // Each zone keeps hold of its own circle — same trick as its
    // player — so the trigger can restyle it later.
    trail.zones.forEach(function (zone) {
      zone.circle = L.circle([zone.lat, zone.lon], { radius: zone.radius })
        .addTo(map)
        .bindPopup(zone.name);
    });

    // Circle colours: Leaflet's usual blue when quiet, green while
    // the zone's track is playing, grey once a zone has used up all
    // its plays — visibly done rather than mysteriously silent.
    const quietColour = "#3388ff";
    const playingColour = "#2a7f2a";
    const finishedColour = "#888888";

    // Has this zone used up its allowance of fresh starts?
    function playsSpent(zone) {
      return typeof zone.plays === "number" &&
             zone.playCount >= zone.plays;
    }

    // The one answer to "what is this zone doing right now?".
    // Everything that reports — circle colours, the zone table, the
    // audio read-out — asks this, so they can never disagree.
    //   "playing"          sound is coming out (a finish tail counts)
    //   "finished"         all plays used; the zone is done
    //   "paused mid-track" a stop-zone waiting for the walker back
    //   "quiet"            not started, or ended with plays left
    function zoneState(zone) {
      if (!zone.player.paused && !zone.player.ended) {
        return "playing";
      }
      if (playsSpent(zone)) {
        return "finished";
      }
      if (zone.playCount > 0 && !zone.player.ended &&
          zone.player.currentTime > 0) {
        return "paused mid-track";
      }
      return "quiet";
    }

    // Paint a zone's circle to match its state.
    function paintZone(zone) {
      const state = zoneState(zone);
      let colour = quietColour;
      if (state === "playing") { colour = playingColour; }
      if (state === "finished") { colour = finishedColour; }
      zone.circle.setStyle({ color: colour, fillColor: colour });
    }

    // "play 1" or "play 1 of 2" — the same wording feeds the zone
    // table and the log, so they can never disagree.
    function playsLine(zone) {
      if (typeof zone.plays === "number") {
        return "play " + zone.playCount + " of " + zone.plays;
      }
      return "play " + zone.playCount;
    }

    // Write one line to the event log, stamped with the clock time,
    // newest at the top — in the field you read the top line, not
    // scroll to the bottom.
    const logList = document.getElementById("log");
    function logEvent(message) {
      const line = document.createElement("li");
      line.textContent =
        new Date().toLocaleTimeString() + " — " + message;
      logList.prepend(line);
    }

    // The per-zone status table: one row per zone, built once from
    // the trail file. Each zone keeps hold of its own cells — the
    // same trick as its player and its circle.
    const zonesTable = document.getElementById("zones");
    trail.zones.forEach(function (zone) {
      const row = zonesTable.insertRow();
      row.insertCell().textContent = zone.name;
      zone.distanceCell = row.insertCell();
      zone.stateCell = row.insertCell();
      zone.playsCell = row.insertCell();
      zone.distanceCell.textContent = "—";
      updateZoneCells(zone);
    });

    // Refresh a zone's state and plays cells. Distance is filled in
    // by the position handler — the only code that knows where we
    // are.
    function updateZoneCells(zone) {
      zone.stateCell.textContent = zoneState(zone);
      zone.playsCell.textContent = playsLine(zone);
    }

    // A walker has just crossed INTO this zone. Decide whether that
    // means sound, and keep the log honest about the decision.
    function arriveAt(zone) {
      // Fresh start, or picking up a sound already under way? A
      // fresh start is the first ever play, or a play after the
      // track fully ended. Resuming a paused track and rejoining a
      // "finish" tail are neither — they don't spend a play.
      const startingFresh =
        (zone.playCount === 0 || zone.player.ended);

      // A zone with a number for "plays" only gets that many fresh
      // starts. Once spent, arriving plays nothing.
      if (startingFresh && playsSpent(zone)) {
        logEvent("entered " + zone.name +
          " — no plays left, staying quiet");
        return;
      }

      // If the track had already finished, wind it back to the
      // start ourselves — some phones (iPhones included) won't
      // replay an ended track from play() alone.
      if (zone.player.ended) {
        zone.player.currentTime = 0;
      }

      if (startingFresh) {
        zone.playCount = zone.playCount + 1;
        logEvent("entered " + zone.name +
          " — playing (" + playsLine(zone) + ")");
      } else {
        logEvent("entered " + zone.name +
          " — carrying on where it left off");
      }

      // Looping is switched back on each arrival, because a
      // "finish" exit switches it off.
      zone.player.loop = (zone.loop === true);
      zone.player.play();
      paintZone(zone);
    }

    // A walker has just crossed OUT of this zone. The zone's exit
    // setting decides what happens to a sound caught mid-play.
    function leaveFrom(zone) {
      // Was anything audible at the moment of leaving? Only for the
      // log — "stopped" when nothing was playing would send a
      // debugger down the wrong path.
      const wasAudible = (zoneState(zone) === "playing");

      if (zone.exit === "finish") {
        // Let the current play-through end naturally: switch
        // looping off so it can't start again, touch nothing else.
        // The circle stays lit until the "ended" listener dims it.
        zone.player.loop = false;
        logEvent("left " + zone.name + (wasAudible
          ? " — letting it finish" : " — was already quiet"));
        return;
      }

      // "stop" — and the safe default for a zone with no exit line:
      // quiet straight away. (Not rewound — walking back in picks
      // up where it left off. A design choice we can revisit.)
      zone.player.pause();
      logEvent("left " + zone.name + (wasAudible
        ? " — stopped" : " — was already quiet"));
      paintZone(zone);
    }
    map.fitBounds(
      trail.zones.map(function (zone) { return [zone.lat, zone.lon]; }),
      { padding: [40, 40], maxZoom: 17 }
    );

    // How far apart two points are, in metres. This treats the ground
    // as flat, which is near-enough exact at trail scale (the error
    // only matters over many kilometres).
    function distanceInMetres(here, zone) {
      // A degree of latitude is about 111,320 m everywhere. A degree
      // of longitude is that much at the equator and shrinks towards
      // the poles — the cos() applies that squeeze for our latitude.
      const north = (here.latitude - zone.lat) * 111320;
      const east = (here.longitude - zone.lon) * 111320
                   * Math.cos(here.latitude * Math.PI / 180);
      // Those are two sides of a right angle; Pythagoras gives the
      // straight-line distance.
      return Math.sqrt(north * north + east * east);
    }

    // When the Start button is tapped, start following our position.
    // watchPosition keeps reporting for as long as the page is open.
    document.getElementById("start").addEventListener("click", function () {

      // One watch is enough — a second tap would start a second one,
      // so switch the button off once it's done its job.
      document.getElementById("start").disabled = true;

      document.getElementById("updated").textContent = "asking…";

      // Unlock every zone's audio. Mobile browsers only let a page
      // start sound during a real tap — so every track starts here,
      // and is paused at once. All are now "user-approved": the
      // zones, not taps, decide when each really plays.
      trail.zones.forEach(function (zone) {
        zone.player.play().then(
          function () {
            zone.player.pause();
          },
          function (error) {
            document.getElementById("audio-state").textContent =
              zone.name + " failed: " + error.message;
          }
        );
      });
      document.getElementById("audio-state").textContent =
        "unlocked — waiting for a zone";
      logEvent("started — audio unlocked, waiting for a position");

      navigator.geolocation.watchPosition(

        // Runs if we get a position.
        function (position) {
          document.getElementById("position").textContent =
            position.coords.latitude + ", " + position.coords.longitude;

          // Accuracy is a radius in metres: "you are within this many
          // metres of the point above". Smaller is better.
          document.getElementById("accuracy").textContent =
            Math.round(position.coords.accuracy) + " m";

          // Draw ourselves — from the SAME fix that drives the
          // numbers and the triggers, so map, read-outs and audio
          // can never disagree about where we are.
          const here = [position.coords.latitude, position.coords.longitude];
          if (hereDot === null) {
            // First fix: create dot and halo, and glance over once —
            // after that the map never moves itself.
            hereDot = L.circleMarker(here,
              { radius: 6, color: "#c00", fillOpacity: 1 }).addTo(map);
            hereHalo = L.circle(here,
              { radius: position.coords.accuracy,
                color: "#c00", weight: 1, fillOpacity: 0.05 }).addTo(map);
            map.panTo(here);
          } else {
            hereDot.setLatLng(here);
            hereHalo.setLatLng(here);
            hereHalo.setRadius(position.coords.accuracy);
          }

          // Check every zone against where we are now, remembering
          // the nearest for the read-out. Infinity means "further
          // than anything" — so the first zone always beats it.
          let nearest = null;
          let nearestDistance = Infinity;

          trail.zones.forEach(function (zone) {
            const distance = distanceInMetres(position.coords, zone);
            const nowInside = distance <= zone.radius;

            // Act only when the answer CHANGES — crossing the line
            // is the event. What arriving and leaving actually mean
            // lives in arriveAt and leaveFrom, up with the other
            // zone functions.
            if (nowInside && !zone.inside) { arriveAt(zone); }
            if (!nowInside && zone.inside) { leaveFrom(zone); }
            zone.inside = nowInside;

            // Keep the zone's row in the status table current: the
            // distance from this fix, and the state right now.
            zone.distanceCell.textContent = Math.round(distance) + " m";
            updateZoneCells(zone);

            if (distance < nearestDistance) {
              nearestDistance = distance;
              nearest = zone;
            }
          });

          document.getElementById("distance").textContent =
            nearest.name + ", " + Math.round(nearestDistance) + " m";

          // The audio read-out reports STATE, not events: rebuild the
          // list of everything playing, fresh, on every fix — asking
          // zoneState, the same answer the table and circles use.
          const playing = trail.zones
            .filter(function (zone) {
              return zoneState(zone) === "playing";
            })
            .map(function (zone) { return zone.name; });

          let audioLine = "quiet";
          if (playing.length > 0) {
            audioLine = "playing — " + playing.join(", ");
          }
          document.getElementById("audio-state").textContent = audioLine;

          // Note the arrival: one more fix, at this moment.
          // The ticker below turns lastFixAt into "n s ago".
          updateCount = updateCount + 1;
          lastFixAt = Date.now();
          document.getElementById("count").textContent = updateCount;
        },

        // Runs if we don't — permission refused, no signal, etc.
        // Showing the reason on the page is the diagnostic bit.
        function (error) {
          document.getElementById("updated").textContent =
            "failed: " + error.message;
          logEvent("position failed: " + error.message);
        },

        // Ask for the best fix the device can give (real GPS on a
        // phone). Costs more battery — the right trade for a trail.
        { enableHighAccuracy: true }
      );

      // A once-a-second ticker: how stale is the latest fix?
      // If the GPS goes quiet, this number climbs — and that's the
      // page telling the truth instead of saying "just now" forever.
      setInterval(function () {
        if (lastFixAt !== null) {
          const seconds = Math.round((Date.now() - lastFixAt) / 1000);
          document.getElementById("updated").textContent = seconds + " s ago";
        }
      }, 1000);
    });
  </script>

</body>
</html>
