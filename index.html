<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mixtape</title>
</head>
<body>

  <h1>Where am I?</h1>

  <!-- Safari only shares location after a real tap, and audio will need
       a tap on every mobile browser anyway. So the experience starts
       with a button — same as every trail will. -->
  <button id="start">Start</button>

  <!-- Three read-outs. Each dash is a placeholder that JavaScript will
       replace later. The id on each span is the hook it will use to
       find the right one. -->
  <p>Position – <span id="position">—</span></p>
  <p>Accuracy – <span id="accuracy">—</span></p>
  <p>Last update – <span id="updated">—</span></p>
  <p>Updates – <span id="count">—</span></p>

  <script>
    // Two bits of memory, so the page can report frequency:
    // how many fixes have arrived, and the clock time of the latest one.
    let updateCount = 0;
    let lastFixAt = null;

    // When the Start button is tapped, start following our position.
    // watchPosition keeps reporting for as long as the page is open.
    document.getElementById("start").addEventListener("click", function () {

      // One watch is enough — a second tap would start a second one,
      // so switch the button off once it's done its job.
      document.getElementById("start").disabled = true;

      document.getElementById("updated").textContent = "asking…";

      navigator.geolocation.watchPosition(

        // Runs if we get a position.
        function (position) {
          document.getElementById("position").textContent =
            position.coords.latitude + ", " + position.coords.longitude;

          // Accuracy is a radius in metres: "you are within this many
          // metres of the point above". Smaller is better.
          document.getElementById("accuracy").textContent =
            Math.round(position.coords.accuracy) + " m";

          // Note the arrival: one more fix, at this moment.
          // The ticker below turns lastFixAt into "n s ago".
          updateCount = updateCount + 1;
          lastFixAt = Date.now();
          document.getElementById("count").textContent = updateCount;
        },

        // Runs if we don't — permission refused, no signal, etc.
        // Showing the reason on the page is the diagnostic bit.
        function (error) {
          document.getElementById("updated").textContent =
            "failed: " + error.message;
        },

        // Ask for the best fix the device can give (real GPS on a
        // phone). Costs more battery — the right trade for a trail.
        { enableHighAccuracy: true }
      );

      // A once-a-second ticker: how stale is the latest fix?
      // If the GPS goes quiet, this number climbs — and that's the
      // page telling the truth instead of saying "just now" forever.
      setInterval(function () {
        if (lastFixAt !== null) {
          const seconds = Math.round((Date.now() - lastFixAt) / 1000);
          document.getElementById("updated").textContent = seconds + " s ago";
        }
      }, 1000);
    });
  </script>

</body>
</html>
