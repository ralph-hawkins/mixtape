<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mixtape — trail map</title>

  <!-- Leaflet, the map library: one stylesheet, one script, fetched
       from a public code-hosting service (a "CDN") rather than our
       repo. The version number is pinned so it can't change under us. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* The map fills the whole window. Leaflet insists its container
       has a real height — forget this and you get a blank page. */
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; }

    /* The locate button floats over the map's top-right corner.
       Leaflet's own layers use z-index values in the hundreds, so
       1000 keeps the button on top and tappable. */
    #locate {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      padding: 8px 12px;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <!-- The box Leaflet draws the map into. -->
  <div id="map"></div>

  <!-- Same rule as the walker's page: Safari only shares location
       after a real tap, so following starts from a button. -->
  <button id="locate">Where am I?</button>

  <!-- The same trail definition the engine uses — one source of
       truth, two views of it. -->
  <script src="trail.js"></script>

  <script>
    // Same loud failure as the walker's page: a map with no trail
    // should say why, not show an empty world.
    if (typeof trail === "undefined") {
      document.getElementById("map").textContent =
        "trail.js failed to load — check the file for typos";
      throw new Error("trail.js missing or broken");
    }

    // Build a map in the box above. No start view yet — we frame it
    // around the trail once the zones are drawn, below.
    const map = L.map("map");

    // The map imagery itself comes as square "tiles" from
    // OpenStreetMap's servers, free to use — showing the credit line
    // is the one condition.
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors"
    }).addTo(map);

    // Draw each zone as a circle, true to its radius in metres —
    // Leaflet scales it with the zoom, so what you see is what the
    // trigger uses. Tapping a circle shows the zone's name.
    trail.zones.forEach(function (zone) {
      L.circle([zone.lat, zone.lon], { radius: zone.radius })
        .addTo(map)
        .bindPopup(zone.name);
    });

    // Frame the view around the whole trail: collect every zone's
    // centre, then fit the map to hold them all, with breathing room.
    // (maxZoom stops a one-zone trail zooming in to doorstep level.)
    const points = trail.zones.map(function (zone) {
      return [zone.lat, zone.lon];
    });
    map.fitBounds(points, { padding: [40, 40], maxZoom: 17 });

    // "You are here": a red dot for the latest fix, plus a halo
    // showing the accuracy — honestly, "somewhere in this circle".
    // Both start empty and get created on the first fix.
    let hereDot = null;
    let hereHalo = null;

    document.getElementById("locate").addEventListener("click", function () {
      const button = document.getElementById("locate");
      button.disabled = true;
      button.textContent = "finding…";

      navigator.geolocation.watchPosition(

        function (position) {
          const here = [position.coords.latitude, position.coords.longitude];

          if (hereDot === null) {
            // First fix: create the dot and halo, and glance over to
            // them — once. After that the map never moves itself:
            // fighting the author's own panning is worse than rude.
            hereDot = L.circleMarker(here,
              { radius: 6, color: "#c00", fillOpacity: 1 }).addTo(map);
            hereHalo = L.circle(here,
              { radius: position.coords.accuracy,
                color: "#c00", weight: 1, fillOpacity: 0.05 }).addTo(map);
            map.panTo(here);
            button.textContent = "following";
          } else {
            // Every later fix just moves them. Standing still and
            // watching the dot wander is GPS jitter, drawn live.
            hereDot.setLatLng(here);
            hereHalo.setLatLng(here);
            hereHalo.setRadius(position.coords.accuracy);
          }
        },

        function (error) {
          button.textContent = "location failed: " + error.message;
        },

        { enableHighAccuracy: true }
      );
    });
  </script>

</body>
</html>
