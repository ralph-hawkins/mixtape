<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build a trail — Mixtape</title>
  <link rel="stylesheet" href="curate.css">
</head>
<body>

  <div class="masthead">Mixtape</div>

  <div class="page">
    <div id="problems" hidden></div>

    <h1>Build a trail</h1>
    <p>Put sounds in places. A walker passing hears them.</p>

    <label class="question" for="who">What is your name?</label>
    <p class="hint">So the trail records who changed what.</p>
    <input type="text" id="who" autocomplete="name">

    <label class="question" for="password">Password</label>
    <p class="hint">The one Ralph gave you — everyone building trails uses the same one. This device will remember it.</p>
    <input type="password" id="password" autocomplete="current-password">

    <button id="go">Continue</button>
  </div>

  <script src="trail-file.js"></script>
  <script src="curate.js"></script>
  <script>
    const problems = document.getElementById("problems");
    const whoBox = document.getElementById("who");
    const passwordBox = document.getElementById("password");

    whoBox.value = Curate.who();
    passwordBox.value = Curate.password();

    // Where to go once they are in — either the page they were trying
    // to reach, or the list of trails.
    const then = Curate.ask("then") || "trails.html";

    document.getElementById("go").addEventListener("click", function () {
      const found = [];
      if (!whoBox.value.trim()) { found.push({ says: "Enter your name" }); }
      if (!passwordBox.value) { found.push({ says: "Enter the password" }); }
      if (found.length > 0) { Curate.showProblems(problems, found); return; }

      Curate.signIn(whoBox.value.trim(), passwordBox.value);
      // Nothing here can tell whether the password is right — only
      // saving can, because only the save service knows it. Claiming
      // otherwise would be a guess.
      Curate.go(then);
    });
  </script>

</body>
</html>
